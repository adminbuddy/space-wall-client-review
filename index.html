<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Концепция v01 — две учебни стени</title>
  <style>
    :root {
      --night: #07162f;
      --ink: #f6f1e4;
      --gold: #f4c542;
      --ice: #a8e0ff;
      --plaque: #10264a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--night);
      color: var(--ink);
      font-family: "PT Sans", "Helvetica Neue", system-ui, sans-serif;
      line-height: 1.45;
    }
    header, main, footer {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 20px 16px;
    }
    header { padding-top: 28px; }
    .note {
      display: inline-block;
      margin: 0 0 12px;
      padding: 8px 12px;
      background: var(--plaque);
      border-left: 3px solid var(--gold);
      font-size: 15px;
    }
    h1 { font-size: 1.55rem; margin: 0 0 8px; color: var(--gold); letter-spacing: 0.02em; }
    h2 { font-size: 1.15rem; margin: 0 0 8px; color: var(--ice); }
    p { margin: 0 0 12px; }
    .hint { font-size: 0.92rem; opacity: 0.8; }
    figure { margin: 0 0 36px; }
    a.shot {
      display: block;
      background: #0b2148;
      border-radius: 8px;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y pinch-zoom;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    a.shot img {
      display: block;
      width: 100%;
      height: auto;
    }
    a.shot.tall img {
      width: auto;
      max-width: 100%;
      max-height: 86vh;
      margin: 0 auto;
    }
    figcaption { font-size: 0.9rem; opacity: 0.75; margin-top: 8px; }
    footer { font-size: 0.85rem; opacity: 0.65; padding-bottom: 40px; }
  </style>
</head>
<body>
  <header>
    <p class="note">Концепция v01 — само за визуален преглед, не е файл за печат</p>
    <h1>Две учебни стени за училището</h1>
    <p>Отворете всяка снимка, за да я видите по-голяма. На телефона може да я увеличите с жест.</p>
  </header>
  <main>
    <figure>
      <h2>Стена A — Слънчевата система</h2>
      <a class="shot" href="stena-a-slanchevata-sistema_v01.png" target="_blank" rel="noopener">
        <img src="stena-a-slanchevata-sistema_v01.png" alt="Стена A: Слънчевата система, концепция v01" width="2750" height="1000">
      </a>
      <figcaption>Натиснете снимката, за да я отворите и увеличите.</figcaption>
    </figure>
    <figure>
      <h2>Стена B — Джеймс Уеб</h2>
      <a class="shot tall" href="stena-b-dzheyms-ueb_v01.png" target="_blank" rel="noopener">
        <img src="stena-b-dzheyms-ueb_v01.png" alt="Стена B: телескопът Джеймс Уеб, концепция v01" width="1248" height="1600">
      </a>
      <figcaption>Натиснете снимката, за да я отворите и увеличите.</figcaption>
    </figure>
  </main>
  <footer>
    Чернова за съгласуване на вида и текстовете. Не използвайте тези файлове за печат.
  </footer>
</body>
</html>
